<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>EasySS Selector</title>
  <link rel="stylesheet" href="modal.css">
</head>
<body>
  <div class="modal-overlay" id="overlay">
    <div class="modal-container">
      <div class="modal-header">
        <div class="header-title">
          <div class="logo-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <div>
            <h2>EasySS Selector</h2>
            <p class="subtitle">Selecciona una captura reciente o pega una nueva</p>
          </div>
        </div>
        <button id="closeBtn" class="icon-btn" title="Cerrar">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" style="width:20px;height:20px;"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>
      
      <div class="modal-body">
        <div id="imageGrid" class="image-grid">
          <div class="loading">
            <div class="spinner"></div>
            <div>Buscando imágenes en el portapapeles...</div>
          </div>
        </div>
      </div>
      
      <div class="modal-footer">
        <div class="footer-info">
          <div class="shortcut-badge">Win + Shift + S</div>
          <span>para capturar pantalla</span>
        </div>
        <div class="footer-actions">
          <button id="fallbackBtn" class="btn btn-secondary">
            <svg style="width:18px;height:18px;margin-right:8px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
            Explorador de archivos
          </button>
        </div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast">
    <svg style="width:20px;height:20px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
    <span>Imagen pegada con éxito</span>
  </div>
  <script src="modal.js"></script>
</body>
</html>
